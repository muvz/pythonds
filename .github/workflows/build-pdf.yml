name: Build Sphinx PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install LaTeX & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra texlive-lang-all latexmk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx rst2pdf sphinx-bootstrap-theme runestone pythonds
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build PDF via Sphinx
        run: |
          sphinx-build -b latex -A course_id=pythonds -D html_context.course_id=pythonds . _build/latex
          make -C _build/latex LATEXMKOPTS="-interaction=nonstopmode" || true

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pythonds3-book-pdf
          path: _build/latex/*.pdf
