name: Build Pythonds PDF

on:
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-lang-all

      - name: Install PreTeXt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pretext[all]"

      - name: Build PDF
        run: |
          pretext build pdf

      - name: Find generated PDF
        run: |
          echo "PDF files:"
          find . -type f -name "*.pdf" -print

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: pythonds-pdf
          path: "**/*.pdf"
          if-no-files-found: error
